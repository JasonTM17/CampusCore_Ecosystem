spring:
  application:
    name: campuscore-restful-api
  main:
    banner-mode: off
  servlet:
    multipart:
      # Feedback item 7: thesis report documents (.pdf/.doc/.docx, <= 20 MB),
      # validated again in ReportFilePolicy after the bytes are read.
      max-file-size: 20MB
      max-request-size: 21MB
  mvc:
    throw-exception-if-no-handler-found: true
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    # No default on purpose: mail credentials come from the environment or a
    # secret store, never from a committed value.
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

thesis:
  report:
    storage:
      # Local is the safe default for previews. Set provider=supabase only in
      # an explicitly configured environment with a server-side service key.
      provider: ${THESIS_REPORT_STORAGE_PROVIDER:local}
      bucket: ${THESIS_REPORT_STORAGE_BUCKET:thesis-reports}
      local-root: ${THESIS_REPORT_STORAGE_LOCAL_ROOT:${java.io.tmpdir}/campuscore/thesis-reports}
      supabase-url: ${SUPABASE_URL:}
      supabase-service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      timeout-ms: ${THESIS_REPORT_STORAGE_TIMEOUT_MS:10000}

server:
  port: ${PORT:${SERVER_PORT:4010}}
  # Deliberately no forward-headers-strategy: "framework" rewrites
  # getRemoteAddr() from client-controlled X-Forwarded-For entries, which made
  # every IP-keyed control (login rate limit, session/reset audit IPs)
  # spoofable by any client that could reach the service directly. The shared
  # ClientIpResolver owns forwarded-header handling behind a trusted proxy.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:30}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:4}
    accept-count: 50

security:
  jwt:
    secret: ${JWT_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:${JWT_SECRET:}}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
  access-token-cookie: ${ACCESS_TOKEN_COOKIE:cc_access_token}
  refresh-token-cookie: ${REFRESH_TOKEN_COOKIE:cc_refresh_token}
  csrf-cookie: ${CSRF_COOKIE:cc_csrf}
  csrf-header: ${CSRF_HEADER:X-CSRF-Token}
  cookie-secure: ${COOKIE_SECURE:false}

# Identity authority (docs/ecosystem/identity-contract.md). Flag matrix:
# enabled=false removes the whole /oauth2 + discovery surface; authorize-paused
# returns 503 on authorize only. Default OFF — schema expand ships first.
identity:
  oidc:
    enabled: ${IDENTITY_OIDC_ENABLED:false}
    authorize-paused: ${IDENTITY_OIDC_AUTHORIZE_PAUSED:false}
    dev-keygen: ${IDENTITY_DEV_KEYGEN:false}
    issuer-uri: ${IDENTITY_ISSUER_URI:http://127.0.0.1:4010}
    login-page: ${IDENTITY_LOGIN_PAGE:/login}
    token-encryption-key: ${IDENTITY_TOKEN_ENCRYPTION_KEY:}
    # Public clients allowlisted for refresh-token issuance at the code
    # exchange (SAS suppresses it for NONE clients; RFC 8252 native apps need
    # it — mobile-policy.md §3). cu-mobile today; confidential unaffected.
    native-refresh-client-ids: ${IDENTITY_NATIVE_REFRESH_CLIENT_IDS:}
  retention:
    enabled: ${IDENTITY_RETENTION_ENABLED:true}
    cron: ${IDENTITY_RETENTION_CRON:0 39 4 * * *}
    grace: ${IDENTITY_RETENTION_GRACE:7d}
  bff:
    # Browser BFF lane (docs/ecosystem/host-policy.md). Off by default; the
    # endpoints and tables only activate behind an edge that strips caller
    # routing headers and stamps the trusted surface pair. Deployments MUST
    # also add each surface origin to app.cors.allowed-origin-patterns —
    # the CORS gate runs before the BFF session layer.
    enabled: ${IDENTITY_BFF_ENABLED:false}
    dev-http: ${IDENTITY_BFF_DEV_HTTP:false}
    issuer-loopback: ${IDENTITY_BFF_ISSUER_LOOPBACK:${IDENTITY_ISSUER_URI:http://127.0.0.1:4010}}
    issuer-public: ${IDENTITY_BFF_ISSUER_PUBLIC:${IDENTITY_ISSUER_URI:http://127.0.0.1:4010}}
    session-ttl: ${IDENTITY_BFF_SESSION_TTL:12h}
    transaction-ttl: ${IDENTITY_BFF_TX_TTL:5m}
    api-allowlist:
      - /api/v1/me
      - /api/v1/auth/me
      - /api/v1/announcements
      - /api/v1/article-taxonomy
      - /api/v1/notifications
      - /api/v1/site-appearance
      - /api/v1/academic
      - /api/v1/engagement
      - /api/v1/events
      - /api/v1/library
      - /api/v1/careers
      - /api/v1/lms
      - /api/v1/auth/change-password
    # Anonymous read lane (P06): GET/HEAD onto these prefixes proxies WITHOUT
    # a session cookie — the upstream permitAll set in SecurityConfig is the
    # authority, so this list mirrors it exactly and adds nothing private.
    public-api-allowlist:
      - /api/v1/announcements/public
      - /api/v1/public/docs
      - /api/v1/article-taxonomy/v2/categories
      - /api/v1/site-appearance
  # keys[]/clients[] bind via indexed env properties
  # (IDENTITY_KEYS_0_KID, IDENTITY_CLIENTS_0_CLIENTID, ...) — see contract §2.1

health:
  readiness-key: ${HEALTH_READINESS_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# NOTE: a single deepseek: block lives near the end of this file — a
# duplicated top-level key silently shadowed these values (last-wins), so the
# provider timeout/token defaults must only ever be defined once.
assistant:
  datasource:
    # The Assistant-only connection uses the same PostgreSQL endpoint as the
    # primary pool unless an operator supplies a dedicated URL. Credentials
    # are separate and never fall back to the primary postgres credentials.
    url: ${ASSISTANT_DB_URL:${SPRING_DATASOURCE_URL:}}
    username: ${ASSISTANT_DB_USERNAME:campuscore_assistant_runtime}
    password: ${ASSISTANT_DB_PASSWORD:}
    maximum-pool-size: ${ASSISTANT_DB_POOL_MAX:4}
    connection-timeout-ms: ${ASSISTANT_DB_CONNECTION_TIMEOUT_MS:15000}
    idle-timeout-ms: ${ASSISTANT_DB_IDLE_TIMEOUT_MS:60000}
    keepalive-time-ms: ${ASSISTANT_DB_KEEPALIVE_TIME_MS:0}
  recovery:
    activity-aware: ${ASSISTANT_RECOVERY_ACTIVITY_AWARE:true}
    active-window-ms: ${ASSISTANT_RECOVERY_ACTIVE_WINDOW_MS:300000}
    safety-interval-ms: ${ASSISTANT_RECOVERY_SAFETY_INTERVAL_MS:900000}
  rls:
    test-mode: ${ASSISTANT_RLS_TEST_MODE:false}
  knowledge:
    # sql keeps the course/local authoring compatibility path; production REST
    # uses remote and private rag-service uses supabase.
    authority-mode: ${ASSISTANT_KNOWLEDGE_AUTHORITY_MODE:sql}
    # In-memory snapshot of the active release's PUBLIC corpus. Retrieval
    # (including the fast-path confidence probe) replays the SQL WHERE/ORDER BY
    # over this copy instead of paying a database round-trip per request —
    # on a remote datasource that trip dominates fast-path latency. The corpus
    # is shared (RLS is scope-scoped, never owner-scoped), so one snapshot is
    # safe for every caller. A republished release propagates within ttl-ms;
    # a failed load backs off briefly and every search falls back to SQL.
    snapshot-cache:
      enabled: ${ASSISTANT_KNOWLEDGE_SNAPSHOT_CACHE:true}
      ttl-ms: ${ASSISTANT_KNOWLEDGE_SNAPSHOT_TTL_MS:30000}
  max-context-chars: ${ASSISTANT_MAX_CONTEXT_CHARS:6000}
  max-message-chars: ${ASSISTANT_MAX_MESSAGE_CHARS:2000}
  user-daily-quota: ${ASSISTANT_USER_DAILY_QUOTA:20}
  global-daily-quota: ${ASSISTANT_GLOBAL_DAILY_QUOTA:200}
  # Keep quota enforcement on by default. Local dogfooding may explicitly set
  # ASSISTANT_QUOTA_ENFORCED=false without changing the production default.
  quota-enforced: ${ASSISTANT_QUOTA_ENFORCED:true}
  retention-days: ${ASSISTANT_RETENTION_DAYS:90}
  # Lexical retrieval window (documents handed to the provider), clamped 3-10.
  top-k: ${ASSISTANT_TOP_K:5}
  # Lexical-first fast path (chatbot latency): when local curated-KB retrieval
  # returns a confident top document, the JSON and SSE chat routes answer
  # immediately from that document (reasonCode ANSWERED, model
  # curated-lexical-fast, real citations) instead of paying the remote
  # RAG -> DeepSeek round-trip. Weak, scoped-out or empty lexical windows
  # escalate to the remote RAG chain exactly as before.
  lexical-fast-path: ${ASSISTANT_LEXICAL_FAST_PATH:true}
  # Minimum retrieval score of the TOP document that counts as a confident
  # fast-path match. The score is the repository's own ranking expression
  # summed over retrieval terms (title substring 3, content substring 1,
  # title whole-word 4, content whole-word 2). One term alone can contribute
  # at most 10, so 11 requires corroboration by a second distinct term —
  # this is what keeps incidental collisions ("công" in "công thức nấu phở"
  # hitting "Công nghệ thông tin") off the fast path while seeded campus
  # topics clear it with margin. Clamped 0-100.
  lexical-confident-score: ${ASSISTANT_LEXICAL_CONFIDENT_SCORE:11}
  recovery-delay-ms: ${ASSISTANT_RECOVERY_DELAY_MS:30000}
  recovery-initial-delay-ms: ${ASSISTANT_RECOVERY_INITIAL_DELAY_MS:30000}
  rag:
    base-url: ${ASSISTANT_RAG_BASE_URL:}
    service-token: ${ASSISTANT_RAG_SERVICE_TOKEN:}
    service-mode: ${ASSISTANT_RAG_SERVICE_MODE:false}
    connect-timeout-ms: ${ASSISTANT_RAG_CONNECT_TIMEOUT_MS:1000}
    # Read timeout covers the whole remote chain (retrieval + DeepSeek
    # generation) on the JSON path. Normal chains answer in 4-10s; past 15s
    # the controller degrades to the local lexical fallback instead of
    # keeping the user waiting 30s. Operators can override via env.
    read-timeout-ms: ${ASSISTANT_RAG_READ_TIMEOUT_MS:15000}
  supabase:
    enabled: ${ASSISTANT_SUPABASE_ENABLED:false}
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    schema: ${SUPABASE_SCHEMA:assistant}
    release-table: ${SUPABASE_RELEASE_TABLE:knowledge_release}
    document-table: ${SUPABASE_DOCUMENT_TABLE:knowledge_release_document}
    reconcile-delay-ms: ${ASSISTANT_SUPABASE_RECONCILE_DELAY_MS:900000}
    reconcile-initial-delay-ms: ${ASSISTANT_SUPABASE_RECONCILE_INITIAL_DELAY_MS:120000}
    connect-timeout-ms: ${ASSISTANT_SUPABASE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ASSISTANT_SUPABASE_READ_TIMEOUT_MS:30000}

academic:
  enrolled-count:
    # Wave 1.4: hourly enrolledCount reconcile. The job only WARNs on drift
    # unless repair is explicitly enabled by an operator.
    reconcile-delay-ms: ${ACADEMIC_ENROLLED_COUNT_RECONCILE_DELAY_MS:3600000}
    reconcile-initial-delay-ms: ${ACADEMIC_ENROLLED_COUNT_RECONCILE_INITIAL_DELAY_MS:120000}
    repair: ${ACADEMIC_ENROLLED_COUNT_REPAIR:false}

mail:
  from: ${MAIL_FROM:no-reply@campuscore.local}
  sender-name: ${MAIL_SENDER_NAME:CampusUTE - Trường Đại học Công nghệ Kỹ thuật TP.HCM}
  enabled: ${MAIL_ENABLED:true}

---
spring:
  config:
    activate:
      on-profile: persistence
  autoconfigure:
    exclude:
      # SAS is wired manually in IdentitySecurityConfig behind
      # identity.oidc.enabled; Boot's autoconfig would register its own
      # authorization-server and default filter chains unconditionally.
      - org.springframework.boot.security.oauth2.server.authorization.autoconfigure.servlet.OAuth2AuthorizationServerAutoConfiguration
      - org.springframework.boot.security.oauth2.server.authorization.autoconfigure.servlet.OAuth2AuthorizationServerJwtAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campuscore?currentSchema=thesis}
    username: ${SPRING_DATASOURCE_USERNAME:campuscore}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:8}
      minimum-idle: ${DB_POOL_MIN:0}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:15000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:60000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:0}
  jpa:
    hibernate:
      # Flyway owns two identifier families: snake_case (thesis, academic) and quoted
      # camelCase objects such as engagement."ArticleCategory"."nameVi". The default
      # camel-case-to-underscore strategy rewrites quoted names too, which made every
      # entity-mapped article route fail with "table not found"; this strategy keeps
      # quoted identifiers verbatim and is unchanged for all snake_case mappings.
      naming:
        physical-strategy: io.campuscore.restfulapi.config.PreserveQuotedIdentifierNamingStrategy
      # Flyway owns the schema; Hibernate must not reject focused fixture tests
      # that intentionally disable migrations and create only their own tables.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: thesis
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    create-schemas: true
    default-schema: thesis
    schemas: thesis,academic,campuscore_auth,campuscore_identity
    locations: classpath:db/migration

app:
  # Public base URL of the web frontend, used to build absolute links in
  # outbound mail (password reset). Never derived from request headers —
  # Host/X-Forwarded-Host are client-controlled and would let an attacker
  # point reset links at their own domain.
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3100}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Enable only when behind a trusted reverse proxy that sets X-Real-IP /
    # X-Forwarded-For (e.g. Render). Direct/local deployments must keep this
    # false so spoofed forwarded headers cannot evade IP-keyed limits.
    trust-proxy-headers: ${RATE_LIMIT_TRUST_PROXY_HEADERS:false}
    # Only when the trusted proxy OVERWRITES X-Real-IP (rather than the client
    # supplying it). Leave false unless the proxy is known to sanitize the
    # header; X-Forwarded-For's rightmost entry is always preferred instead.
    trust-real-ip: ${RATE_LIMIT_TRUST_REAL_IP:false}
    # Shared secret for the first-party edge proxy (the Next.js same-origin
    # API route). When it matches X-Campuscore-Proxy-Token, the companion
    # X-Campuscore-Client-Ip header is the real client address — the edge saw
    # the client, so rightmost XFF is the edge's own egress IP, not the user.
    proxy-token: ${RATE_LIMIT_PROXY_TOKEN:}
    login-limit: ${RATE_LIMIT_LOGIN:15}
    default-limit: ${RATE_LIMIT_DEFAULT:40}
    default-window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  demo:
    # The seeded showcase accounts carry passwords published in this repository's
    # history, so they are DISABLED unless a deployment opts in. Local and
    # evaluation builds set DEMO_ACCOUNTS_ENABLED=true; a public host must not.
    accounts-enabled: ${DEMO_ACCOUNTS_ENABLED:false}
    # Demo override: when > 0, EVERY student's effective registration credit
    # limit becomes this value (bypasses the 28-credit standard and the
    # raise-application flow). 0 keeps the standard/approved behaviour.
    # See CreditLimitApplicationService.effectiveLimit (round-2 static-4).
    # (demo.* keys mirror the REGISTRATION_CREDIT_LIMIT_OVERRIDE env var.)
    credit-limit-override: ${REGISTRATION_CREDIT_LIMIT_OVERRIDE:0}
    # Optional scope: comma-separated role names, e.g. STUDENT or STUDENT,LECTURER.
    # When set AND accounts-enabled=true, only demo accounts holding one of these
    # roles become ACTIVE; the rest are LOCKED. Empty (default) keeps the
    # historical behavior of activating every demo role.
    roles: ${DEMO_ACCOUNTS_ROLES:}

deepseek:
  enabled: ${DEEPSEEK_ENABLED:false}
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
  timeout-ms: ${DEEPSEEK_TIMEOUT_MS:15000}
  max-output-tokens: ${DEEPSEEK_MAX_OUTPUT_TOKENS:1200}
  max-response-bytes: ${DEEPSEEK_MAX_RESPONSE_BYTES:512000}
  max-frame-bytes: ${DEEPSEEK_MAX_FRAME_BYTES:64000}
  max-concurrent: ${DEEPSEEK_MAX_CONCURRENT:4}
