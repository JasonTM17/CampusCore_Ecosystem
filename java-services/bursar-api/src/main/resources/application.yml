server:
  port: 4012

spring:
  application:
    name: bursar-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campuscore_restful}
    username: ${SPRING_DATASOURCE_USERNAME:campuscore}
    password: ${SPRING_DATASOURCE_PASSWORD:campuscore}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Own history table — shared Postgres hosts several services' migrations.
    table: bursar_flyway_schema_history
    schemas: bursar
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: bursar

security:
  jwt:
    secret: ${JWT_SECRET:dev-insecure-secret-change-me}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-insecure-refresh-secret-change-me}

bursar:
  internal-token: ${BURSAR_INTERNAL_TOKEN:}
