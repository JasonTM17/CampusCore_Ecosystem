services:
  postgres:
    build:
      context: .
      dockerfile: database/Dockerfile
    image: student-management-ute-database:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campuscore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-campuscore_restful}
      ASSISTANT_DB_PROVISIONER_PASSWORD: ${ASSISTANT_DB_PROVISIONER_PASSWORD:?Set ASSISTANT_DB_PROVISIONER_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - campuscore_restful_postgres_data:/var/lib/postgresql/data
      - ./ops/assistant/bootstrap-provisioner.sql:/docker-entrypoint-initdb.d/20-assistant-provisioner.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campuscore} -d ${POSTGRES_DB:-campuscore_restful}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    restart: unless-stopped

  # The owner bootstrap above creates the isolated roles and function before
  # Flyway runs. This one-shot receives the restricted login and runtime
  # password only; it never receives POSTGRES_PASSWORD.
  assistant-db-provisioner:
    image: node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
    working_dir: /provision
    volumes:
      - ./scripts/provision-assistant-runtime.mjs:/provision/provision-assistant-runtime.mjs:ro
    environment:
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?Set ASSISTANT_DB_PASSWORD}
      ASSISTANT_DB_PROVISIONER_PASSWORD: ${ASSISTANT_DB_PROVISIONER_PASSWORD:?Set ASSISTANT_DB_PROVISIONER_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-campuscore_restful}
      # Private compose network; TLS is not available on the database image.
      PGSSLMODE: disable
    command: ["node", "/provision/provision-assistant-runtime.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 128m

  rag-service:
    build:
      context: .
      dockerfile: java-services/restful-api/Dockerfile
    image: student-management-ute-rag-service:local
    environment:
      SPRING_PROFILES_ACTIVE: persistence
      SERVER_PORT: 4011
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-campuscore_restful}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-campuscore}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      # Dedicated assistant RLS runtime login; provisioned one-shot above.
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?Set ASSISTANT_DB_PASSWORD}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-2000}
      DB_VALIDATION_TIMEOUT_MS: ${DB_VALIDATION_TIMEOUT_MS:-1000}
      HEALTH_READINESS_KEY: ${HEALTH_READINESS_KEY:?Set HEALTH_READINESS_KEY}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      SECURITY_JWT_REJECT_KNOWN_DEFAULTS: "true"
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      # Base Compose keeps seeded accounts locked. The local overlay opts in.
      DEMO_ACCOUNTS_ENABLED: "false"
      ASSISTANT_RAG_SERVICE_MODE: "true"
      ASSISTANT_RAG_SERVICE_TOKEN: ${ASSISTANT_RAG_SERVICE_TOKEN:?Set ASSISTANT_RAG_SERVICE_TOKEN}
      ASSISTANT_RAG_OWNER_ASSERTION_SECRET: "${ASSISTANT_RAG_OWNER_ASSERTION_SECRET:?Set ASSISTANT_RAG_OWNER_ASSERTION_SECRET to a generated key}"
      ASSISTANT_KNOWLEDGE_AUTHORITY_MODE: "disabled"
      ASSISTANT_RETENTION_ENABLED: ${ASSISTANT_RETENTION_ENABLED:-true}
      DEEPSEEK_ENABLED: ${DEEPSEEK_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-8000}
      DEEPSEEK_MAX_OUTPUT_TOKENS: ${DEEPSEEK_MAX_OUTPUT_TOKENS:-800}
      ASSISTANT_MAX_MESSAGE_CHARS: ${ASSISTANT_MAX_MESSAGE_CHARS:-2000}
      ASSISTANT_MAX_CONTEXT_CHARS: ${ASSISTANT_MAX_CONTEXT_CHARS:-6000}
      ASSISTANT_USER_DAILY_QUOTA: ${ASSISTANT_USER_DAILY_QUOTA:-20}
      ASSISTANT_GLOBAL_DAILY_QUOTA: ${ASSISTANT_GLOBAL_DAILY_QUOTA:-200}
      ASSISTANT_QUOTA_ENFORCED: ${ASSISTANT_QUOTA_ENFORCED:-true}
      ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-90}
    expose:
      - "4011"
    depends_on:
      postgres:
        condition: service_healthy
      assistant-db-provisioner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --header=\"X-Health-Key: $${HEALTH_READINESS_KEY}\" -O- http://localhost:4011/api/v1/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Memory budget (1G): a memory-unbounded sidecar
    # behind the same internal network is a silent OOM risk on dev hosts.
    mem_limit: 1g
    restart: unless-stopped

  restful-api:
    build:
      context: .
      dockerfile: java-services/restful-api/Dockerfile
    image: student-management-ute-restful-api:local
    environment:
      SPRING_PROFILES_ACTIVE: persistence
      SERVER_PORT: 4010
      IDENTITY_BFF_ISSUER_LOOPBACK: http://127.0.0.1:4010
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-campuscore_restful}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-campuscore}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      # Dedicated assistant RLS runtime login; provisioned one-shot above. A
      # missing value would degrade the assistant (503) instead of killing boot.
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?Set ASSISTANT_DB_PASSWORD}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-2000}
      DB_VALIDATION_TIMEOUT_MS: ${DB_VALIDATION_TIMEOUT_MS:-1000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      SECURITY_JWT_REJECT_KNOWN_DEFAULTS: "true"
      HEALTH_READINESS_KEY: ${HEALTH_READINESS_KEY:?Set HEALTH_READINESS_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FLYWAY_ENABLED: "false"
      # Base Compose keeps seeded accounts locked. The local overlay opts in.
      DEMO_ACCOUNTS_ENABLED: "false"
      ASSISTANT_KNOWLEDGE_AUTHORITY_MODE: "sql"
      ASSISTANT_RAG_BASE_URL: http://rag-service:4011/internal/rag/assistant
      ASSISTANT_RAG_SERVICE_TOKEN: ${ASSISTANT_RAG_SERVICE_TOKEN:?Set ASSISTANT_RAG_SERVICE_TOKEN}
      ASSISTANT_RAG_OWNER_ASSERTION_SECRET: "${ASSISTANT_RAG_OWNER_ASSERTION_SECRET:?Set ASSISTANT_RAG_OWNER_ASSERTION_SECRET to a generated key}"
      ASSISTANT_RETENTION_ENABLED: "false"
      # Mail is opt-in. Enable it only with a real SMTP password file; the
      # local Mailpit container remains available for an explicit opt-in.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-false}
      # Mailpit intentionally has no STARTTLS support.  Disabling only
      # `enable` is insufficient because Spring's application default marks
      # STARTTLS as required, which makes the health endpoint report DOWN.
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@campuscore.local}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:3100}
      # Only valid behind an edge that overwrites the forwarded client headers
      # (the committed Caddyfile does); the token proves a request crossed it.
      RATE_LIMIT_TRUST_PROXY_HEADERS: ${RATE_LIMIT_TRUST_PROXY_HEADERS:-false}
      RATE_LIMIT_TRUST_REAL_IP: ${RATE_LIMIT_TRUST_REAL_IP:-false}
      RATE_LIMIT_PROXY_TOKEN: ${RATE_LIMIT_PROXY_TOKEN:-}
      THESIS_REPORT_STORAGE_PROVIDER: ${THESIS_REPORT_STORAGE_PROVIDER:-local}
      THESIS_REPORT_STORAGE_BUCKET: ${THESIS_REPORT_STORAGE_BUCKET:-thesis-reports}
      THESIS_REPORT_STORAGE_LOCAL_ROOT: /var/lib/campuscore/thesis-reports
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ASSISTANT_MAX_MESSAGE_CHARS: ${ASSISTANT_MAX_MESSAGE_CHARS:-2000}
      ASSISTANT_MAX_CONTEXT_CHARS: ${ASSISTANT_MAX_CONTEXT_CHARS:-6000}
      ASSISTANT_USER_DAILY_QUOTA: ${ASSISTANT_USER_DAILY_QUOTA:-20}
      ASSISTANT_GLOBAL_DAILY_QUOTA: ${ASSISTANT_GLOBAL_DAILY_QUOTA:-200}
      ASSISTANT_QUOTA_ENFORCED: ${ASSISTANT_QUOTA_ENFORCED:-true}
      ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-90}
      ASSISTANT_LEXICAL_FAST_PATH: ${ASSISTANT_LEXICAL_FAST_PATH:-true}
      ASSISTANT_LEXICAL_CONFIDENT_SCORE: ${ASSISTANT_LEXICAL_CONFIDENT_SCORE:-11}
    ports:
      - "127.0.0.1:${RESTFUL_API_HOST_PORT:-4010}:4010"
    volumes:
      - campuscore_thesis_report_storage:/var/lib/campuscore/thesis-reports
    depends_on:
      postgres:
        condition: service_healthy
      assistant-db-provisioner:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --header=\"X-Health-Key: $${HEALTH_READINESS_KEY}\" -O- http://localhost:4010/api/v1/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        JAVA_API_ORIGIN: ${JAVA_API_ORIGIN:-http://restful-api:4010}
        # Same-origin browser path. Do not interpolate host/Expo NEXT_PUBLIC_API_URL.
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: ${NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS:-}
        NEXT_PUBLIC_DEMO_STUDENT_PASSWORD: ${NEXT_PUBLIC_DEMO_STUDENT_PASSWORD:-}
        NEXT_PUBLIC_DEMO_LECTURER_PASSWORD: ${NEXT_PUBLIC_DEMO_LECTURER_PASSWORD:-}
        NEXT_PUBLIC_DEMO_DEAN_PASSWORD: ${NEXT_PUBLIC_DEMO_DEAN_PASSWORD:-}
    image: student-management-ute-frontend:local
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      JAVA_API_ORIGIN: ${JAVA_API_ORIGIN:-http://restful-api:4010}
      NEXT_PUBLIC_API_URL: /api/v1
      CAMPUSCORE_PROXY_TOKEN: ${CAMPUSCORE_PROXY_TOKEN:-}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      restful-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  campuscore_restful_postgres_data:
  campuscore_thesis_report_storage:
