<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140" role="img" aria-labelledby="title desc">
  <title id="title">CampusUTE mobile architecture</title>
  <desc id="desc">Expo Router and role-aware mobile screens use one authenticated API client, a native file adapter, an in-memory offline query cache, and a separate OIDC token store to reach the REST API and PostgreSQL.</desc>
  <style>
    text { font-family: sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="1600" height="1140" fill="#ffffff"/>
  <text x="64" y="58" fill="#111827" font-size="30" font-weight="700">CampusUTE mobile architecture</text>
  <text x="64" y="88" fill="#6b7280" font-size="15">Expo routes and role-aware screens, one REST client, native file handling, and explicit session / offline boundaries</text>

  <rect x="48" y="120" width="1504" height="610" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="72" y="150" fill="#2563eb" font-size="12" font-weight="700" letter-spacing="2">EXPO + REACT NATIVE CLIENT</text>

  <rect x="80" y="178" width="270" height="145" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="118" cy="216" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="118" y="221" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">EX</text>
  <text x="151" y="214" fill="#111827" font-size="18" font-weight="700">Expo Router</text>
  <text x="104" y="254" fill="#6b7280" font-size="13">App shell, deep links,</text>
  <text x="104" y="275" fill="#6b7280" font-size="13">sign-in and recovery routes</text>
  <text x="104" y="300" fill="#6b7280" font-size="12">mobile/app/</text>

  <rect x="410" y="178" width="300" height="145" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="560" y="214" text-anchor="middle" fill="#111827" font-size="18" font-weight="700">Route map + access guard</text>
  <text x="434" y="250" fill="#6b7280" font-size="13">Maps paths to screen families</text>
  <text x="434" y="272" fill="#6b7280" font-size="13">and checks session, role, grants</text>
  <text x="434" y="300" fill="#6b7280" font-size="12">mobile/src/navigation/</text>

  <rect x="760" y="164" width="740" height="370" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="784" y="198" fill="#111827" font-size="19" font-weight="700">Role-aware screens</text>
  <text x="784" y="220" fill="#6b7280" font-size="12">Representative routes; screen and route registries own the full map</text>

  <rect x="784" y="240" width="340" height="94" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
  <text x="804" y="267" fill="#1e3a5f" font-size="15" font-weight="700">Student</text>
  <text x="804" y="291" fill="#475569" font-size="13">Dashboard · schedule · registration</text>
  <text x="804" y="313" fill="#475569" font-size="13">grades · thesis · campus content</text>

  <rect x="1144" y="240" width="332" height="94" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
  <text x="1164" y="267" fill="#1e3a5f" font-size="15" font-weight="700">Lecturer</text>
  <text x="1164" y="291" fill="#475569" font-size="13">Dashboard · schedule · gradebook</text>
  <text x="1164" y="313" fill="#475569" font-size="13">class attendance</text>

  <rect x="784" y="350" width="340" height="82" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="804" y="378" fill="#334155" font-size="15" font-weight="700">Admin</text>
  <text x="804" y="405" fill="#475569" font-size="13">Dashboard · student and lecturer lists</text>

  <rect x="1144" y="350" width="332" height="82" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="1164" y="378" fill="#334155" font-size="15" font-weight="700">Shared account surfaces</text>
  <text x="1164" y="405" fill="#475569" font-size="13">Profile · notifications + push · assistant</text>

  <rect x="784" y="448" width="692" height="62" rx="11" fill="#fff7ed" stroke="#fb923c" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="804" y="474" fill="#9a3412" font-size="14" font-weight="700">Student check-in lane</text>
  <text x="804" y="496" fill="#7c2d12" font-size="12">EXPO_PUBLIC_LANE_CHECKIN is build-time and off by default</text>

  <path d="M350 250 H404" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M710 250 H752" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="80" y="570" width="360" height="126" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <rect x="88" y="578" width="344" height="110" rx="10" fill="none" stroke="#a7f3d0" stroke-width="1"/>
  <text x="104" y="607" fill="#111827" font-size="17" font-weight="700">Shared API client</text>
  <text x="104" y="632" fill="#475569" font-size="13">apiClient · configured /api/v1 origin</text>
  <text x="104" y="654" fill="#475569" font-size="13">Bearer access · shared 401 refresh lane</text>
  <text x="104" y="678" fill="#6b7280" font-size="12">Feature facades use this client</text>

  <rect x="465" y="570" width="300" height="126" rx="14" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="485" y="607" fill="#111827" font-size="17" font-weight="700">Session store</text>
  <text x="485" y="632" fill="#475569" font-size="13">Access token stays in memory</text>
  <text x="485" y="654" fill="#475569" font-size="13">Refresh token lives in SecureStore</text>
  <text x="485" y="678" fill="#6b7280" font-size="12">OIDC issuer calls stay separate</text>

  <rect x="790" y="570" width="340" height="126" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="810" y="607" fill="#111827" font-size="17" font-weight="700">Native file adapter</text>
  <text x="810" y="632" fill="#475569" font-size="13">Pick → async copy to app cache → upload</text>
  <text x="810" y="654" fill="#475569" font-size="13">Save and share through native sheets</text>
  <text x="810" y="678" fill="#9a3412" font-size="12">Printing hands off to the web</text>

  <rect x="1155" y="570" width="345" height="126" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1175" y="607" fill="#111827" font-size="17" font-weight="700">Offline query cache</text>
  <text x="1175" y="632" fill="#475569" font-size="13">Per-account, in-memory reads</text>
  <text x="1175" y="654" fill="#475569" font-size="13">May show stale data after a network error</text>
  <text x="1175" y="678" fill="#6b7280" font-size="12">No persistent offline store or offline writes</text>

  <path d="M900 534 L430 584" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M1100 534 L960 584" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <path d="M1450 534 L1325 584" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <path d="M465 633 H444" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-purple)"/>

  <rect x="48" y="800" width="1504" height="290" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="660" y="830" fill="#059669" font-size="12" font-weight="700" letter-spacing="2">IDENTITY, API, AND DATA BOUNDARY</text>

  <rect x="80" y="872" width="360" height="142" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="260" y="906" text-anchor="middle" fill="#111827" font-size="17" font-weight="700">API edge</text>
  <text x="260" y="932" text-anchor="middle" fill="#6b7280" font-size="13">Configured reverse proxy, when used</text>
  <text x="260" y="955" text-anchor="middle" fill="#6b7280" font-size="13">Forwards public /api/v1 traffic</text>
  <text x="260" y="986" text-anchor="middle" fill="#6b7280" font-size="12">Local default targets REST API :4010</text>

  <rect x="465" y="872" width="300" height="142" rx="14" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="615" y="906" text-anchor="middle" fill="#111827" font-size="17" font-weight="700">OIDC identity issuer</text>
  <text x="615" y="932" text-anchor="middle" fill="#6b7280" font-size="13">/oauth2/authorize · token · revoke</text>
  <text x="615" y="955" text-anchor="middle" fill="#6b7280" font-size="13">Sign-in and refresh flow</text>
  <text x="615" y="986" text-anchor="middle" fill="#6b7280" font-size="12">Separate from the REST API client</text>

  <rect x="830" y="872" width="320" height="142" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <rect x="838" y="880" width="304" height="126" rx="10" fill="none" stroke="#a7f3d0" stroke-width="1"/>
  <text x="990" y="906" text-anchor="middle" fill="#111827" font-size="18" font-weight="700">restful-api</text>
  <text x="990" y="932" text-anchor="middle" fill="#6b7280" font-size="13">Spring Boot · /api/v1</text>
  <text x="990" y="955" text-anchor="middle" fill="#6b7280" font-size="13">Authentication, role checks, domain API</text>
  <text x="990" y="986" text-anchor="middle" fill="#6b7280" font-size="12">Server owns records and mutations</text>

  <rect x="1220" y="872" width="280" height="142" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="1360" y="906" text-anchor="middle" fill="#1e3a5f" font-size="17" font-weight="700">PostgreSQL</text>
  <ellipse cx="1360" cy="936" rx="96" ry="12" fill="#dbeafe" stroke="#336791" stroke-width="1.5"/>
  <rect x="1264" y="936" width="192" height="32" fill="#eff6ff"/>
  <line x1="1264" y1="936" x2="1264" y2="968" stroke="#336791" stroke-width="1.5"/>
  <line x1="1456" y1="936" x2="1456" y2="968" stroke="#336791" stroke-width="1.5"/>
  <ellipse cx="1360" cy="968" rx="96" ry="12" fill="#dbeafe" stroke="#336791" stroke-width="1.5"/>
  <text x="1360" y="1002" text-anchor="middle" fill="#6b7280" font-size="12">Relational system of record</text>

  <path d="M260 696 V862" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M615 696 V862" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M440 943 H450 V1034 H815 V943 H824" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M1150 943 H1214" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1182" y="930" text-anchor="middle" fill="#059669" font-size="12">reads</text><text x="1182" y="962" text-anchor="middle" fill="#059669" font-size="12">writes</text>
  <text x="72" y="1074" fill="#6b7280" font-size="12">The deployment proxy is environment-specific; the repository's prepared edge is Caddy.</text>
</svg>
