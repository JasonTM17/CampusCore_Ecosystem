<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="1600" height="1600" role="img" aria-labelledby="title desc">
  <title id="title">CampusUTE mobile sign-in, refresh, and picked-file upload sequence</title>
  <desc id="desc">OIDC sign-in exchanges an authorization code using PKCE, the refresh token is stored in SecureStore, the shared API client delegates refresh to the issuer, and picked files are asynchronously copied to app cache before upload.</desc>
  <style>
    text { font-family: sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="1600" height="1600" fill="#ffffff"/>
  <text x="64" y="58" fill="#111827" font-size="30" font-weight="700">Mobile sign-in, refresh, and file upload</text>
  <text x="64" y="88" fill="#6b7280" font-size="15">OIDC credentials stay separate from authenticated REST calls; picked files get an owned async cache copy</text>

  <rect x="48" y="118" width="1504" height="64" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="72" y="145" fill="#2563eb" font-size="12" font-weight="700" letter-spacing="1.5">PARTICIPANTS</text>
  <text x="72" y="167" fill="#475569" font-size="13">Sign-in and refresh use the issuer; business requests use the shared API client.</text>

  <g fill="#ffffff" stroke="#93c5fd" stroke-width="1.4">
    <rect x="28" y="204" width="144" height="64" rx="11"/>
    <rect x="228" y="204" width="144" height="64" rx="11"/>
    <rect x="428" y="204" width="144" height="64" rx="11"/>
    <rect x="628" y="204" width="144" height="64" rx="11"/>
    <rect x="828" y="204" width="144" height="64" rx="11"/>
    <rect x="1028" y="204" width="144" height="64" rx="11"/>
    <rect x="1228" y="204" width="144" height="64" rx="11"/>
    <rect x="1428" y="204" width="144" height="64" rx="11"/>
  </g>
  <g fill="#111827" font-size="14" font-weight="700" text-anchor="middle">
    <text x="100" y="242">User</text>
    <text x="300" y="232">Expo app</text><text x="300" y="252" font-size="12" font-weight="400">+ session store</text>
    <text x="500" y="232">System browser</text><text x="500" y="252" font-size="12" font-weight="400">+ document picker</text>
    <text x="700" y="242">OIDC issuer</text>
    <text x="900" y="242">SecureStore</text>
    <text x="1100" y="232">Expo FileSystem</text><text x="1100" y="252" font-size="12" font-weight="400">app cache</text>
    <text x="1300" y="232">Shared API</text><text x="1300" y="252" font-size="12" font-weight="400">client</text>
    <text x="1500" y="232">REST API</text><text x="1500" y="252" font-size="12" font-weight="400">edge / restful-api</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,5">
    <line x1="100" y1="268" x2="100" y2="1512"/>
    <line x1="300" y1="268" x2="300" y2="1512"/>
    <line x1="500" y1="268" x2="500" y2="1512"/>
    <line x1="700" y1="268" x2="700" y2="1512"/>
    <line x1="900" y1="268" x2="900" y2="1512"/>
    <line x1="1100" y1="268" x2="1100" y2="1512"/>
    <line x1="1300" y1="268" x2="1300" y2="1512"/>
    <line x1="1500" y1="268" x2="1500" y2="1512"/>
  </g>

  <rect x="48" y="286" width="1504" height="44" rx="10" fill="#eff6ff"/>
  <text x="72" y="315" fill="#2563eb" font-size="15" font-weight="700">1 · OIDC sign-in</text>

  <text x="200" y="350" text-anchor="middle" fill="#475569" font-size="12">Tap Sign in</text>
  <line x1="100" y1="360" x2="292" y2="360" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
  <text x="400" y="390" text-anchor="middle" fill="#475569" font-size="12">Open authorization session with PKCE</text>
  <line x1="300" y1="400" x2="492" y2="400" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
  <text x="600" y="430" text-anchor="middle" fill="#475569" font-size="12">Authorize at issuer</text>
  <line x1="500" y1="440" x2="692" y2="440" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
  <text x="600" y="470" text-anchor="middle" fill="#475569" font-size="12">Redirect with authorization code</text>
  <line x1="700" y1="480" x2="508" y2="480" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
  <text x="400" y="510" text-anchor="middle" fill="#475569" font-size="12">Return callback; app checks state</text>
  <line x1="500" y1="520" x2="308" y2="520" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
  <text x="500" y="550" text-anchor="middle" fill="#475569" font-size="12">POST /oauth2/token with code + verifier</text>
  <line x1="300" y1="560" x2="692" y2="560" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
  <text x="500" y="590" text-anchor="middle" fill="#475569" font-size="12">Return access token + refresh token</text>
  <line x1="700" y1="600" x2="308" y2="600" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
  <text x="600" y="630" text-anchor="middle" fill="#7c3aed" font-size="12">Persist refresh token</text>
  <line x1="300" y1="640" x2="892" y2="640" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#arrow-purple)"/>
  <text x="800" y="660" text-anchor="middle" fill="#475569" font-size="12">Keep access token in app memory</text>
  <line x1="300" y1="670" x2="1292" y2="670" stroke="#059669" stroke-width="1.7" marker-end="url(#arrow-green)"/>

  <rect x="48" y="700" width="1504" height="44" rx="10" fill="#f5f3ff"/>
  <text x="72" y="729" fill="#7c3aed" font-size="15" font-weight="700">2 · Shared refresh after an API 401</text>

  <text x="1400" y="764" text-anchor="middle" fill="#475569" font-size="12">Authenticated /api/v1 request</text>
  <line x1="1300" y1="774" x2="1492" y2="774" stroke="#059669" stroke-width="1.7" marker-end="url(#arrow-green)"/>
  <text x="1400" y="804" text-anchor="middle" fill="#475569" font-size="12">401 response</text>
  <line x1="1500" y1="814" x2="1308" y2="814" stroke="#059669" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <text x="800" y="844" text-anchor="middle" fill="#7c3aed" font-size="12">Join the session store's shared refresh flight</text>
  <line x1="1300" y1="854" x2="308" y2="854" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#arrow-purple)"/>
  <text x="600" y="884" text-anchor="middle" fill="#7c3aed" font-size="12">Read stored refresh token</text>
  <line x1="300" y1="894" x2="892" y2="894" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#arrow-purple)"/>
  <text x="600" y="924" text-anchor="middle" fill="#7c3aed" font-size="12">Return token to session store</text>
  <line x1="900" y1="934" x2="308" y2="934" stroke="#7c3aed" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <text x="500" y="964" text-anchor="middle" fill="#7c3aed" font-size="12">POST /oauth2/token (refresh_token grant)</text>
  <line x1="300" y1="974" x2="692" y2="974" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#arrow-purple)"/>
  <text x="500" y="1004" text-anchor="middle" fill="#7c3aed" font-size="12">Return rotated access + refresh tokens</text>
  <line x1="700" y1="1014" x2="308" y2="1014" stroke="#7c3aed" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <text x="600" y="1044" text-anchor="middle" fill="#7c3aed" font-size="12">Replace stored refresh token</text>
  <line x1="300" y1="1054" x2="892" y2="1054" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#arrow-purple)"/>
  <text x="800" y="1084" text-anchor="middle" fill="#475569" font-size="12">Update in-memory access token</text>
  <line x1="300" y1="1094" x2="1292" y2="1094" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>

  <rect x="48" y="1122" width="1504" height="44" rx="10" fill="#fff7ed"/>
  <text x="72" y="1151" fill="#c2410c" font-size="15" font-weight="700">3 · Picked-file upload</text>

  <text x="200" y="1186" text-anchor="middle" fill="#475569" font-size="12">Choose attachment</text>
  <line x1="100" y1="1196" x2="292" y2="1196" stroke="#ea580c" stroke-width="1.7" marker-end="url(#arrow-orange)"/>
  <text x="400" y="1226" text-anchor="middle" fill="#475569" font-size="12">Open native document picker</text>
  <line x1="300" y1="1236" x2="492" y2="1236" stroke="#ea580c" stroke-width="1.7" marker-end="url(#arrow-orange)"/>
  <text x="400" y="1266" text-anchor="middle" fill="#475569" font-size="12">Return picked URI + metadata</text>
  <line x1="500" y1="1276" x2="308" y2="1276" stroke="#ea580c" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrow-orange)"/>
  <text x="700" y="1306" text-anchor="middle" fill="#c2410c" font-size="12">Await copy to app-owned cache; stat and validate</text>
  <line x1="300" y1="1316" x2="1092" y2="1316" stroke="#ea580c" stroke-width="1.7" marker-end="url(#arrow-orange)"/>
  <text x="1200" y="1346" text-anchor="middle" fill="#059669" font-size="12">Upload cached file with Bearer auth</text>
  <line x1="300" y1="1356" x2="1292" y2="1356" stroke="#059669" stroke-width="1.7" marker-end="url(#arrow-green)"/>
  <text x="1400" y="1386" text-anchor="middle" fill="#475569" font-size="12">Authenticated file request</text>
  <line x1="1300" y1="1396" x2="1492" y2="1396" stroke="#059669" stroke-width="1.7" marker-end="url(#arrow-green)"/>
  <text x="1400" y="1426" text-anchor="middle" fill="#475569" font-size="12">Return API result</text>
  <line x1="1500" y1="1436" x2="1308" y2="1436" stroke="#059669" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <text x="700" y="1466" text-anchor="middle" fill="#c2410c" font-size="12">Release the owned temporary copy after the upload flow</text>
  <line x1="300" y1="1476" x2="1092" y2="1476" stroke="#ea580c" stroke-width="1.7" marker-end="url(#arrow-orange)"/>

  <rect x="48" y="1500" width="1504" height="58" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="72" y="1525" fill="#475569" font-size="13">The app cache owns only the temporary picked-file copy. Official printing remains a web handoff; the native file adapter exposes pick, save, and share.</text>
  <text x="72" y="1547" fill="#6b7280" font-size="12">Source owners: mobile/src/auth · mobile/src/api/client.ts · mobile/src/api/native-file-adapter.ts</text>
</svg>
