# ==============================================================================
# CI MATRIX AND GATE SEMANTICS
# ------------------------------------------------------------------------------
# Job -> Gate -> Merge Blocking vs Report-Only:
#
# 1. ecosystem-gates (BLOCKS MERGE):
#    - Source-only checks, masked secret sentinel, and every root scripts/*.test.mjs
#      suite exactly once (the script-suite list is guarded by ci-workflow-replay.test.mjs).
#    - Documentation hygiene: check-doc-hygiene.mjs.
#    - Design token drift: sync-tokens.mjs --check.
#    - Lineage & migrations: check-migrations.mjs and flyway-lineage-check.mjs.
#    - Assistant offline eval: assistant-eval.test.mjs (fail on 0 tests).
#    - Event collision guard: events-preview-collision.test.mjs (fail on 0 tests).
#    - BFF host registry & static policy: host-registry-verify.mjs, static-policy-verify.mjs.
#
# 2. java-api (BLOCKS MERGE):
#    - Java modular monolith compile and surefire verification.
#    - Surefire zero-test assertion: fails if total tests run equals 0 across reports.
#
# 3. frontend (BLOCKS MERGE):
#    - Web dependencies (npm ci), typecheck, lint, build.
#    - Web unit tests (npm test) with assertion that > 0 tests executed.
#
# 4. portal-viewport (BLOCKS MERGE):
#    - Portal shell responsiveness at 1440, 768, and 390 viewports (fail on 0 tests).
#
# 5. mobile (BLOCKS MERGE):
#    - Expo mobile dependencies (npm ci), typecheck (tsc --noEmit).
#    - Mobile unit tests (npm test) with assertion that > 0 tests executed.
#    - Jest component, accessibility, and visual tests (--passWithNoTests=false, fail on 0 tests).
#
# 6. e2e (BLOCKS MERGE):
#    - Official Playwright e2e suite against disposable container stack.
#
# 7. compose (BLOCKS MERGE):
#    - Migration immutability check, docker compose config validation.
#    - Database Flyway boundary, readiness, OpenAPI, multi-role auth, and RAG probes.
#    - Supabase content & Assistant RLS tooling tests (fail on 0 tests).
#
# 8. web-supply-chain (BLOCKS MERGE):
#    - Frontend npm audit (--omit=dev --audit-level=high); production tree is clean.
#
# 9. mobile-supply-chain-report (REPORT-ONLY, DOES NOT BLOCK MERGE):
#    - Mobile npm audit (--omit=dev --audit-level=high): report-only while the upstream
#      expo-router/metro/deepmerge advisories await the mobile dependency task.
# ==============================================================================

name: Course API and Client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: course-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecosystem-gates:
    name: Ecosystem and supply chain gates
    runs-on: ubuntu-latest
    steps:
      - name: Capture CI job start
        id: ci_timing_start
        continue-on-error: true
        run: echo "started_at=$(node -e 'process.stdout.write(new Date().toISOString())')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13'
      - name: Install web dependencies for workflow replay parsing
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Install mobile dependencies for native parity resolution
        run: npm ci --prefix mobile --ignore-scripts --no-audit --no-fund
      - name: Secret hygiene gate (masked secret scan and test)
        shell: bash
        run: |
          set -o pipefail
          if git grep --quiet -E 'sk-[A-Za-z0-9]{20,}' -- . ':!plans' ':!scripts/run-course-e2e.mjs'; then
            echo 'A provider-looking secret is tracked; refusing CI.'
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -ne 1 ]; then
              echo 'Secret sentinel scanner failed; refusing CI.'
              exit "$grep_status"
            fi
          fi
          node scripts/check-assistant-secrets.mjs
      - name: Root script test suites
        shell: bash
        run: |
          set -o pipefail
          node --test \
            scripts/alert-uri-policy.test.mjs \
            scripts/check-mobile-parity.test.mjs \
            scripts/ci-secret-output.test.mjs \
            scripts/ci-timing-report.test.mjs \
            scripts/ci-workflow-replay.test.mjs \
            scripts/contract-verify-options.test.mjs \
            scripts/contract-verify-teardown.test.mjs \
            scripts/dependency-baseline.test.mjs \
            scripts/diagnostic-target-policy.test.mjs \
            scripts/doc-links.test.mjs \
            scripts/ecosystem-backup-drill.test.mjs \
            scripts/ecosystem-devices-verify.test.mjs \
            scripts/ecosystem-doc-index.test.mjs \
            scripts/flyway-lineage-check.test.mjs \
            scripts/locale-keys.test.mjs \
            scripts/platform-load.test.mjs \
            scripts/provision-assistant-runtime.test.mjs \
            scripts/release-promotion-policy.test.mjs \
            scripts/runtime-env-inventory.test.mjs \
            scripts/secret-hygiene.test.mjs \
            scripts/text-encoding.test.mjs \
            scripts/verify-backup.test.mjs \
            2>&1 | tee /tmp/root-script-tests.log
          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/root-script-tests.log", "utf8");
            const m = log.match(/(?:#|ℹ)\s*tests\s+(\d+)/);
            if (!m || parseInt(m[1], 10) === 0) {
              console.error("FAIL: Zero root script tests executed!");
              process.exit(1);
            }
            console.log("PASS: Verified " + m[1] + " root script tests executed.");
          '
      - name: Offline dependency, encoding and source reconciliation checks
        run: |
          node scripts/dependency-baseline.mjs --check
          node scripts/check-text-encoding.mjs
          node scripts/ecosystem-reconcile-check.mjs
      - name: Documentation hygiene gate
        run: node scripts/check-doc-hygiene.mjs
      - name: Design tokens synchronization gate
        run: node scripts/sync-tokens.mjs --check
      - name: Migration source checks
        run: |
          node scripts/check-migrations.mjs
          node scripts/flyway-lineage-check.mjs
      - name: Offline assistant evaluation gate (AUD-16)
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/assistant-eval/assistant-eval.test.mjs 2>&1 | tee /tmp/assistant-eval.log
          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/assistant-eval.log", "utf8");
            const m = log.match(/(?:#|ℹ)\s*tests\s+(\d+)/);
            if (!m || parseInt(m[1], 10) === 0) {
              console.error("FAIL: Zero assistant eval tests executed!");
              process.exit(1);
            }
            console.log(`PASS: Verified ${m[1]} assistant eval tests executed.`);
          '
      - name: Events preview collision guard
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/tests/events-preview-collision.test.mjs 2>&1 | tee /tmp/events-collision.log
          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/events-collision.log", "utf8");
            const m = log.match(/(?:#|ℹ)\s*tests\s+(\d+)/);
            if (!m || parseInt(m[1], 10) === 0) {
              console.error("FAIL: Zero events collision tests executed!");
              process.exit(1);
            }
            console.log(`PASS: Verified ${m[1]} events collision tests executed.`);
          '
      - name: BFF host registry parity and static policy sentinels
        run: |
          node scripts/host-registry-verify.mjs
          node scripts/static-policy-verify.mjs
      - name: Write and validate CI timing summary
        if: always()
        continue-on-error: true
        env:
          CI_TIMING_WORKFLOW: ${{ github.workflow }}
          CI_TIMING_RUN_ID: ${{ github.run_id }}
          CI_TIMING_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_TIMING_JOB: ${{ github.job }}
          CI_TIMING_CONCLUSION: ${{ job.status }}
          CI_TIMING_STARTED_AT: ${{ steps.ci_timing_start.outputs.started_at }}
        run: |
          node scripts/ci-timing-report.mjs --write-job-summary
          node scripts/check-ci-timing-report.mjs artifacts/ci/ci-timing-summary.json
      - name: Upload CI timing summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-timing-${{ github.job }}-${{ github.run_attempt }}
          path: artifacts/ci/ci-timing-summary.json
          if-no-files-found: ignore
          retention-days: 7

  java-api:
    name: Java REST API
    runs-on: ubuntu-latest
    env:
      # Provider tests are stubbed/no-network; a runtime key is never required in CI.
      DEEPSEEK_ENABLED: 'false'
      DEEPSEEK_API_KEY: ''
    steps:
      - name: Capture CI job start
        id: ci_timing_start
        continue-on-error: true
        run: echo "started_at=$(node -e 'process.stdout.write(new Date().toISOString())')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-services/pom.xml
      - name: Install pypdf for PDF parser round-trip tests
        run: python -m pip install --quiet pypdf
      - name: Verify Java API
        run: mvn -q -f java-services/pom.xml verify
      - name: Assert Java tests ran and passed (fail on zero tests)
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const reportDir = "java-services/restful-api/target/surefire-reports";
            if (!fs.existsSync(reportDir)) {
              console.error("FAIL: Surefire reports directory not found:", reportDir);
              process.exit(1);
            }
            const files = fs.readdirSync(reportDir).filter(f => f.endsWith(".txt"));
            if (files.length === 0) {
              console.error("FAIL: No surefire test reports found");
              process.exit(1);
            }
            let total = 0;
            for (const f of files) {
              const content = fs.readFileSync(path.join(reportDir, f), "utf8");
              const m = content.match(/Tests run:\s*(\d+)/);
              if (m) total += parseInt(m[1], 10);
            }
            if (total === 0) {
              console.error("FAIL: Zero Java tests executed across surefire reports (Tests run: 0)");
              process.exit(1);
            }
            console.log(`PASS: Verified ${total} Java tests executed across ${files.length} report files.`);
          '
      - name: Write and validate CI timing summary
        if: always()
        continue-on-error: true
        env:
          CI_TIMING_WORKFLOW: ${{ github.workflow }}
          CI_TIMING_RUN_ID: ${{ github.run_id }}
          CI_TIMING_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_TIMING_JOB: ${{ github.job }}
          CI_TIMING_CONCLUSION: ${{ job.status }}
          CI_TIMING_STARTED_AT: ${{ steps.ci_timing_start.outputs.started_at }}
        run: |
          node scripts/ci-timing-report.mjs --write-job-summary
          node scripts/check-ci-timing-report.mjs artifacts/ci/ci-timing-summary.json
      - name: Upload CI timing summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-timing-${{ github.job }}-${{ github.run_attempt }}
          path: artifacts/ci/ci-timing-summary.json
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Next.js web
    runs-on: ubuntu-latest
    steps:
      - name: Capture CI job start
        id: ci_timing_start
        continue-on-error: true
        run: echo "started_at=$(node -e 'process.stdout.write(new Date().toISOString())')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Test web
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/frontend-test.log
          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/frontend-test.log", "utf8");
            const m = log.match(/(?:#|ℹ)\s*tests\s+(\d+)/);
            if (!m || parseInt(m[1], 10) === 0) {
              console.error("FAIL: Zero web tests executed or summary count missing!");
              process.exit(1);
            }
            console.log(`PASS: Verified ${m[1]} web tests executed.`);
          '
      - name: Typecheck web
        working-directory: frontend
        run: npm run typecheck
      - name: Lint web
        working-directory: frontend
        run: npm run lint
      - name: Build web
        working-directory: frontend
        run: npm run build
      - name: Write and validate CI timing summary
        if: always()
        continue-on-error: true
        env:
          CI_TIMING_WORKFLOW: ${{ github.workflow }}
          CI_TIMING_RUN_ID: ${{ github.run_id }}
          CI_TIMING_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_TIMING_JOB: ${{ github.job }}
          CI_TIMING_CONCLUSION: ${{ job.status }}
          CI_TIMING_STARTED_AT: ${{ steps.ci_timing_start.outputs.started_at }}
        run: |
          node scripts/ci-timing-report.mjs --write-job-summary
          node scripts/check-ci-timing-report.mjs artifacts/ci/ci-timing-summary.json
      - name: Upload CI timing summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-timing-${{ github.job }}-${{ github.run_attempt }}
          path: artifacts/ci/ci-timing-summary.json
          if-no-files-found: ignore
          retention-days: 7

  portal-viewport:
    name: Portal viewport shell
    # Playwright 1.59 has no browser build for ubuntu-latest (26.04); stay on a supported image.
    runs-on: ubuntu-24.04
    steps:
      - name: Capture CI job start
        id: ci_timing_start
        continue-on-error: true
        run: echo "started_at=$(node -e 'process.stdout.write(new Date().toISOString())')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start portal dev server
        working-directory: frontend
        run: |
          nohup npm run dev -- --port 4317 > /tmp/portal-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:4317; then exit 0; fi
            sleep 2
          done
          echo 'portal dev server did not answer within 120s:'
          cat /tmp/portal-dev.log
          exit 1
      - name: Test portal shell at 1440, 768, and 390
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node --test tests/portal-shell.viewport.test.js 2>&1 | tee /tmp/portal-viewport.log
          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/portal-viewport.log", "utf8");
            const m = log.match(/(?:#|ℹ)\s*tests\s+(\d+)/);
            if (!m || parseInt(m[1], 10) === 0) {
              console.error("FAIL: Zero viewport tests executed or summary count missing!");
              process.exit(1);
            }
            console.log(`PASS: Verified ${m[1]} viewport tests executed.`);
          '
      - name: Write and validate CI timing summary
        if: always()
        continue-on-error: true
        env:
          CI_TIMING_WORKFLOW: ${{ github.workflow }}
          CI_TIMING_RUN_ID: ${{ github.run_id }}
          CI_TIMING_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_TIMING_JOB: ${{ github.job }}
          CI_TIMING_CONCLUSION: ${{ job.status }}
          CI_TIMING_STARTED_AT: ${{ steps.ci_timing_start.outputs.started_at }}
        run: |
          node scripts/ci-timing-report.mjs --write-job-summary
          node scripts/check-ci-timing-report.mjs artifacts/ci/ci-timing-summary.json
      - name: Upload CI timing summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-timing-${{ github.job }}-${{ github.run_attempt }}
          path: artifacts/ci/ci-timing-summary.json
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    name: Expo mobile
    runs-on: ubuntu-latest
    steps:
      - name: Capture CI job start
        id: ci_timing_start
        continue-on-error: true
        run: echo "started_at=$(node -e 'process.stdout.write(new Date().toISOString())')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Expo SDK57 requires Node >=22.13 (docs.ecosystem/baseline.md, C-E5).
          node-version: '22.13'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Test mobile
        working-directory: mobile
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/mobile-test.log
          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/mobile-test.log", "utf8");
            const m = log.match(/(?:#|ℹ)\s*tests\s+(\d+)/);
            if (!m || parseInt(m[1], 10) === 0) {
              console.error("FAIL: Zero mobile unit tests executed or summary count missing!");
              process.exit(1);
            }
            console.log(`PASS: Verified ${m[1]} mobile unit tests executed.`);
          '
      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck
      - name: Component, accessibility and structural visual tests
        working-directory: mobile
        shell: bash
        run: |
          set -o pipefail
          npm run test:component -- --passWithNoTests=false 2>&1 | tee /tmp/jest-component.log
          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/jest-component.log", "utf8");
            const m = log.match(/Tests:\s*.*?(?:,\s*|\s*)([0-9]+)\s+total/);
            const passed = log.match(/Tests:\s*([0-9]+)\s+passed/);
            const count = m ? parseInt(m[1], 10) : (passed ? parseInt(passed[1], 10) : 0);
            if (count === 0) {
              console.error("FAIL: Jest executed zero tests!");
              process.exit(1);
            }
            console.log(`PASS: Verified ${count} Jest component tests executed.`);
          '
      - name: Write and validate CI timing summary
        if: always()
        continue-on-error: true
        env:
          CI_TIMING_WORKFLOW: ${{ github.workflow }}
          CI_TIMING_RUN_ID: ${{ github.run_id }}
          CI_TIMING_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_TIMING_JOB: ${{ github.job }}
          CI_TIMING_CONCLUSION: ${{ job.status }}
          CI_TIMING_STARTED_AT: ${{ steps.ci_timing_start.outputs.started_at }}
        run: |
          node scripts/ci-timing-report.mjs --write-job-summary
          node scripts/check-ci-timing-report.mjs artifacts/ci/ci-timing-summary.json
      - name: Upload CI timing summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-timing-${{ github.job }}-${{ github.run_attempt }}
          path: artifacts/ci/ci-timing-summary.json
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Official Playwright e2e
    # Playwright 1.59 has no browser build for ubuntu-latest (26.04); stay on a supported image.
    runs-on: ubuntu-24.04
    env:
      # Keep the suite deterministic and credential-free; the assistant flows
      # under test must exercise the degraded lexical path, not a live model.
      DEEPSEEK_ENABLED: 'false'
      DEEPSEEK_API_KEY: ''
      # Dev-only value for the disposable e2e stack: the assistant RLS runtime
      # role needs a password (>= 16 chars) provisioned before the API boots.
      # It never leaves this CI job and is not a secret.
      ASSISTANT_DB_PASSWORD: 'dev-ci-password-16chars-min'
      E2E_PLAYWRIGHT_PROJECT: chromium
    steps:
      - name: Capture CI job start
        id: ci_timing_start
        continue-on-error: true
        run: echo "started_at=$(node -e 'process.stdout.write(new Date().toISOString())')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run official e2e suite on a disposable stack
        run: node scripts/run-course-e2e.mjs
      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: frontend/test-results/playwright/
          retention-days: 7
      - name: Write and validate CI timing summary
        if: always()
        continue-on-error: true
        env:
          CI_TIMING_WORKFLOW: ${{ github.workflow }}
          CI_TIMING_RUN_ID: ${{ github.run_id }}
          CI_TIMING_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_TIMING_JOB: ${{ github.job }}
          CI_TIMING_CONCLUSION: ${{ job.status }}
          CI_TIMING_STARTED_AT: ${{ steps.ci_timing_start.outputs.started_at }}
        run: |
          node scripts/ci-timing-report.mjs --write-job-summary
          node scripts/check-ci-timing-report.mjs artifacts/ci/ci-timing-summary.json
      - name: Upload CI timing summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-timing-${{ github.job }}-${{ github.run_attempt }}
          path: artifacts/ci/ci-timing-summary.json
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: PostgreSQL and Compose runtime
    runs-on: ubuntu-latest
    needs: ecosystem-gates
    env:
      # Keep the course stack deterministic and credential-free.
      DEEPSEEK_ENABLED: 'false'
      DEEPSEEK_API_KEY: ''
      # Dev-only value for the fresh Compose volume: the assistant RLS runtime
      # role needs a password (>= 16 chars) before the stack can boot. It is
      # committed on purpose (CI-only, not a secret) and never used elsewhere.
      ASSISTANT_DB_PASSWORD: 'dev-ci-password-16chars-min'
    steps:
      - name: Capture CI job start
        id: ci_timing_start
        continue-on-error: true
        run: echo "started_at=$(node -e 'process.stdout.write(new Date().toISOString())')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the immutable-migration guard can diff against
          # origin/main (shallow clones make the merge-base diff empty).
          fetch-depth: 0
      - name: Flyway migrations are immutable once merged
        shell: bash
        run: |
          edited="$(git diff --name-only origin/main...HEAD -- 'java-services/**/db/migration/*.sql' 'java-services/**/db/migration-h2/*.sql')"
          if [ -n "$edited" ]; then
            while IFS= read -r f; do
              if git cat-file -e "origin/main:$f" 2>/dev/null; then
                echo "IMMUTABLE migration edited: $f"
                echo "Corrective changes are new forward migrations (V<n+1>); see db/migration/README.md."
                exit 1
              fi
            done <<< "$edited"
          fi
      - name: Validate Compose
        run: docker compose config
      - name: Supabase content tooling tests
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/supabase/assistant-knowledge.test.mjs 2>&1 | tee /tmp/supabase-tests.log
          node -e '
            const fs = require("fs");
            const log = fs.readFileSync("/tmp/supabase-tests.log", "utf8");
            const m = log.match(/(?:#|ℹ)\s*tests\s+(\d+)/);
            if (!m || parseInt(m[1], 10) === 0) {
              console.error("FAIL: Zero Supabase content tests executed!");
              process.exit(1);
            }
            console.log(`PASS: Verified ${m[1]} Supabase content tests executed.`);
          '
      - name: Build and start fresh course stack
        run: docker compose up -d --build --wait
      - name: Verify database image boundary
        run: docker image inspect student-management-ute-database:local --format '{{.Config.Labels}}' | grep -q 'Flyway'
      - name: Verify Flyway, health, OpenAPI, login and RAG
        shell: bash
        run: |
          version="$(docker compose exec -T postgres psql -U campuscore -d campuscore_restful -Atc 'SELECT version FROM thesis.flyway_schema_history WHERE success ORDER BY installed_rank DESC LIMIT 1')"
          # The schema boundary must equal the newest migration checked in, so a
          # migration that fails to apply (or a forgotten one) fails CI loudly.
          expected="$(ls java-services/restful-api/src/main/resources/db/migration | sed -E 's/^V([0-9]+)__[^.]*\.sql/\1/p' | sort -n | tail -1)"
          test "$version" = "$expected"
          curl --fail --silent --show-error http://127.0.0.1:4010/api/v1/health/liveness
          curl --fail --silent --show-error -H 'X-Health-Key: local-course-health-key' http://127.0.0.1:4010/api/v1/health/readiness
          curl --fail --silent --show-error http://127.0.0.1:4010/v3/api-docs > openapi.json
          python3 -c 'import json; paths=json.load(open("openapi.json", encoding="utf-8"))["paths"]; required={"/api/v1/auth/login", "/api/v1/students", "/api/v1/lecturers", "/api/v1/sections", "/api/v1/enrollments", "/api/v1/enrollments/enroll", "/api/v1/me/enrollments", "/api/v1/registration/rounds", "/api/v1/me/registration/eligibility", "/api/v1/sections/{sectionId}/grades", "/api/v1/announcements", "/api/v1/notifications", "/api/v1/assistant/chat", "/api/v1/assistant/chat/stream", "/api/v1/assistant/conversations", "/api/v1/thesis/assistant/chat", "/api/v1/thesis/assistant/chat/stream", "/api/v1/thesis/assistant/conversations", "/api/v1/admin/assistant/knowledge", "/api/v1/admin/thesis/assistant/knowledge", "/api/v1/thesis/groups/{id}/report/file", "/api/v1/health/readiness"}; assert not required.difference(paths), sorted(required.difference(paths)); assert "/api/v1/auth/register" not in paths, "public self-registration must stay removed"'
          # V48 locks the whole .demo population; V82 then activates exactly the
          # runbook-documented set and DemoAccountGate (gate enabled in this
          # stack) keeps it ACTIVE. Prove the Four-Eyes second approver can
          # sign in with the single published demo password:
          approver_status="$(docker compose exec -T postgres psql -U campuscore -d campuscore_restful -Atc "SELECT \"status\" FROM campuscore_auth.\"User\" WHERE \"email\" = 'admin002@campuscore.demo'")"
          test "$approver_status" = "ACTIVE"
          demo_login="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"email":"admin002@campuscore.demo","password":"password123"}' http://127.0.0.1:4010/api/v1/auth/login)"
          DEMO_LOGIN="$demo_login" python3 -c 'import json, os; assert json.loads(os.environ["DEMO_LOGIN"])["accessToken"]'
          dean_login="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"email":"truongkhoa@campuscore.demo","password":"password123"}' http://127.0.0.1:4010/api/v1/auth/login)"
          DEAN_LOGIN="$dean_login" python3 -c 'import json, os; body=json.loads(os.environ["DEAN_LOGIN"]); assert body["accessToken"]; assert "TRUONG_KHOA" in body["user"]["roles"] and "LECTURER" in body["user"]["roles"]'
          tbm_login="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"email":"truongbomon@campuscore.demo","password":"password123"}' http://127.0.0.1:4010/api/v1/auth/login)"
          TBM_LOGIN="$tbm_login" python3 -c 'import json, os; body=json.loads(os.environ["TBM_LOGIN"]); assert body["accessToken"]; assert "TRUONG_BO_MON" in body["user"]["roles"] and "LECTURER" in body["user"]["roles"]'
          admin_dean_roles="$(docker compose exec -T postgres psql -U campuscore -d campuscore_restful -Atc "SELECT COUNT(*) FROM campuscore_auth.\"UserRole\" ur JOIN campuscore_auth.\"Role\" r ON r.\"id\" = ur.\"roleId\" WHERE ur.\"userId\" = 'admin-user' AND r.\"name\" = 'TRUONG_KHOA'")"
          test "$admin_dean_roles" = "0"
          # V82 is exact-address, not a pattern unlock: a seeded persona outside
          # the runbook set stays LOCKED even with the gate enabled.
          persona_status="$(docker compose exec -T postgres psql -U campuscore -d campuscore_restful -Atc "SELECT \"status\" FROM campuscore_auth.\"User\" WHERE \"email\" = 'an.hnt@campuscore.demo'")"
          test "$persona_status" = "LOCKED"
          persona_login_code="$(curl --max-time 8 --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"an.hnt@campuscore.demo","password":"password123"}' http://127.0.0.1:4010/api/v1/auth/login)"
          test "$persona_login_code" = "401"
          # V50 activates showcase demo student, lecturer, and admin; student login succeeds directly:
          login="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"email":"student@campuscore.edu","password":"password123"}' http://127.0.0.1:4010/api/v1/auth/login)"
          token="$(LOGIN="$login" python3 -c 'import json, os; print(json.loads(os.environ["LOGIN"])["accessToken"])')"
          docker compose exec -T postgres psql -U campuscore -d campuscore_restful -v ON_ERROR_STOP=1 -c "UPDATE academic.\"RegistrationRound\" SET \"windowStart\" = CURRENT_TIMESTAMP - INTERVAL '1 day', \"windowEnd\" = CURRENT_TIMESTAMP + INTERVAL '1 day' WHERE \"id\" = 'round-registration-demo'"
          # Use an unoccupied generated section so the replay probe tests idempotency,
          # rather than colliding with the demo student's seeded timetable.
          first_enrollment="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -H "Authorization: Bearer $token" -H 'Idempotency-Key: ci-postgres-replay-0001' -d '{"sectionId":"section-auto-019"}' http://127.0.0.1:4010/api/v1/me/enrollments)"
          second_enrollment="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -H "Authorization: Bearer $token" -H 'Idempotency-Key: ci-postgres-replay-0001' -d '{"sectionId":"section-auto-019"}' http://127.0.0.1:4010/api/v1/me/enrollments)"
          FIRST_ENROLLMENT="$first_enrollment" SECOND_ENROLLMENT="$second_enrollment" python3 -c 'import json, os; first=json.loads(os.environ["FIRST_ENROLLMENT"]); second=json.loads(os.environ["SECOND_ENROLLMENT"]); assert first["status"] == "ENROLLED", first; assert second["id"] == first["id"], (first, second); assert second["status"] == "ENROLLED", second'
          assistant="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -H "Authorization: Bearer $token" -d '{"message":"Điều kiện đăng ký đề tài là gì?","locale":"vi","clientRequestId":"00000000-0000-0000-0000-000000000001"}' http://127.0.0.1:4010/api/v1/assistant/chat)"
          # PROVIDER_DISABLED is the degraded grounded path; ANSWERED is the
          # curated lexical fast path — both must still carry live citations.
          ASSISTANT="$assistant" python3 -c 'import json, os; data=json.loads(os.environ["ASSISTANT"]); assert data["reasonCode"] in ("PROVIDER_DISABLED", "ANSWERED"), data; assert data["reasonCode"] == "ANSWERED" or data["degraded"] is True, data; assert len(data["citations"]) > 0, data'
          rag_rejection="$(docker compose exec -T rag-service wget --server-response --tries=1 --header='Content-Type: application/json' --header='X-Rag-Service-Token: wrong-token' --header='X-Assistant-Owner: ci-rag-probe' --post-data='{"message":"Điều kiện đăng ký đề tài là gì?","locale":"vi","clientRequestId":"00000000-0000-0000-0000-000000000003"}' -O /dev/null http://localhost:4011/internal/rag/assistant/chat 2>&1 || true)"
          printf '%s\n' "$rag_rejection" | grep -Eq 'HTTP/[0-9.]+ 403'
          rag_internal="$(docker compose exec -T rag-service wget --no-verbose --tries=1 --header='Content-Type: application/json' --header='X-Rag-Service-Token: dev-rag-service-token-rotate-before-exposing' --header='X-Assistant-Owner: ci-rag-probe' --post-data='{"message":"Điều kiện đăng ký đề tài là gì?","locale":"vi","clientRequestId":"00000000-0000-0000-0000-000000000003"}' -O- http://localhost:4011/internal/rag/assistant/chat)"
          RAG_INTERNAL="$rag_internal" python3 -c 'import json, os; data=json.loads(os.environ["RAG_INTERNAL"]); assert data["reasonCode"] in ("PROVIDER_DISABLED", "ANSWERED"), data; assert data["reasonCode"] == "ANSWERED" or data["degraded"] is True, data; assert len(data["citations"]) > 0, data'
          docker compose stop postgres
          # With the database stopped, Hikari must evict its dead pooled
          # connections (validation timeout each) before the probe can answer;
          # allow up to 30s for the expected 503 instead of the 8s that raced
          # connection eviction on slower runners.
          readiness_code="$(curl --max-time 30 --silent --output /dev/null --write-out '%{http_code}' -H 'X-Health-Key: local-course-health-key' http://127.0.0.1:4010/api/v1/health/readiness)"
          test "$readiness_code" = "503"
          # Authenticated requests fail closed while the account store is down: the
          # session cannot be re-verified, so even the assistant answers 503.
          outage_body="$(mktemp)"
          outage_code="$(curl --max-time 30 --silent --output "$outage_body" --write-out '%{http_code}' -H 'Content-Type: application/json' -H "Authorization: Bearer $token" -d '{"message":"Điều kiện đăng ký đề tài là gì?","locale":"vi","clientRequestId":"00000000-0000-0000-0000-000000000002"}' http://127.0.0.1:4010/api/v1/assistant/chat)"
          test "$outage_code" = "503"
          grep -q DATABASE_UNAVAILABLE "$outage_body"
          docker compose start postgres
          docker compose up -d --wait
          curl --fail --silent --show-error -H 'X-Health-Key: local-course-health-key' http://127.0.0.1:4010/api/v1/health/readiness
      - name: Show runtime logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop course stack
        if: always()
        run: docker compose down
      - name: Write and validate CI timing summary
        if: always()
        continue-on-error: true
        env:
          CI_TIMING_WORKFLOW: ${{ github.workflow }}
          CI_TIMING_RUN_ID: ${{ github.run_id }}
          CI_TIMING_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_TIMING_JOB: ${{ github.job }}
          CI_TIMING_CONCLUSION: ${{ job.status }}
          CI_TIMING_STARTED_AT: ${{ steps.ci_timing_start.outputs.started_at }}
        run: |
          node scripts/ci-timing-report.mjs --write-job-summary
          node scripts/check-ci-timing-report.mjs artifacts/ci/ci-timing-summary.json
      - name: Upload CI timing summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-timing-${{ github.job }}-${{ github.run_attempt }}
          path: artifacts/ci/ci-timing-summary.json
          if-no-files-found: ignore
          retention-days: 7

  web-supply-chain:
    name: Web production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Capture CI job start
        id: ci_timing_start
        continue-on-error: true
        run: echo "started_at=$(node -e 'process.stdout.write(new Date().toISOString())')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit web production dependencies (fails on high or critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Write and validate CI timing summary
        if: always()
        continue-on-error: true
        env:
          CI_TIMING_WORKFLOW: ${{ github.workflow }}
          CI_TIMING_RUN_ID: ${{ github.run_id }}
          CI_TIMING_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_TIMING_JOB: ${{ github.job }}
          CI_TIMING_CONCLUSION: ${{ job.status }}
          CI_TIMING_STARTED_AT: ${{ steps.ci_timing_start.outputs.started_at }}
        run: |
          node scripts/ci-timing-report.mjs --write-job-summary
          node scripts/check-ci-timing-report.mjs artifacts/ci/ci-timing-summary.json
      - name: Upload CI timing summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-timing-${{ github.job }}-${{ github.run_attempt }}
          path: artifacts/ci/ci-timing-summary.json
          if-no-files-found: ignore
          retention-days: 7

  mobile-supply-chain-report:
    name: Mobile dependency vulnerability report (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Capture CI job start
        id: ci_timing_start
        continue-on-error: true
        run: echo "started_at=$(node -e 'process.stdout.write(new Date().toISOString())')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Audit mobile dependencies (report-only)
        working-directory: mobile
        continue-on-error: true
        # KNOWN BLOCKER: upstream expo-router/metro/deepmerge dependency tree; triage is the mobile
        # dependency task. Report-only: does not block merge until that task lands.
        run: npm audit --omit=dev --audit-level=high
      - name: Write and validate CI timing summary
        if: always()
        continue-on-error: true
        env:
          CI_TIMING_WORKFLOW: ${{ github.workflow }}
          CI_TIMING_RUN_ID: ${{ github.run_id }}
          CI_TIMING_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_TIMING_JOB: ${{ github.job }}
          CI_TIMING_CONCLUSION: ${{ job.status }}
          CI_TIMING_STARTED_AT: ${{ steps.ci_timing_start.outputs.started_at }}
        run: |
          node scripts/ci-timing-report.mjs --write-job-summary
          node scripts/check-ci-timing-report.mjs artifacts/ci/ci-timing-summary.json
      - name: Upload CI timing summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-timing-${{ github.job }}-${{ github.run_attempt }}
          path: artifacts/ci/ci-timing-summary.json
          if-no-files-found: ignore
          retention-days: 7
