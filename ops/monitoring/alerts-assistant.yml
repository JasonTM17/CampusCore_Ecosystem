# Portable Prometheus Alert Rules: AI Campus Assistant & Knowledge Engine
# Collection/routing NOT_RUN against a live Prometheus instance.
# Missing input series produce no alert; zero traffic yields no ratio/latency breach.
# Scrape/exporter absence requires the deployment monitoring availability policy.
# Cross-reference: docs/ecosystem/observability.md, docs/integrations/deepseek-assistant.md
groups:
  - name: campuscore-assistant
    rules:
      # -----------------------------------------------------------------------
      # 1. Assistant Provider Outage & High Degraded Response Rate
      # Only the bounded degraded=true|false label is exported; no reason/content/identity labels
      # -----------------------------------------------------------------------
      - alert: AssistantHighDegradedRate
        expr: >-
          (sum(rate(campuscore_assistant_requests_total{degraded="true"}[10m]))
          /
          clamp_min(sum(rate(campuscore_assistant_requests_total[10m])), 0.001)) > 0.20
        for: 5m
        labels:
          severity: warning
          service: restful-api
          component: campus-assistant
        annotations:
          summary: "Over 20% of assistant answers are degraded"
          description: >-
            More than 20% of assistant conversations in the last 10 minutes returned degraded
            fallback answers. Check DeepSeek
            provider status, RAG service connectivity, or API key balance.
          runbook_url: "docs/integrations/deepseek-assistant.md#runtime-configuration"
          instrumentation_status: "INSTRUMENTED (MetricsConfiguration and assigned assistant boundaries)"

      # -----------------------------------------------------------------------
      # 2. Daily Quota Near Exhaustion
      # Default: user-daily-quota: 20 | global-daily-quota: 200
      # -----------------------------------------------------------------------
      - alert: AssistantGlobalQuotaExhaustionRisk
        expr: >-
          max(campuscore_assistant_quota_consumed_daily) > 180
        for: 5m
        labels:
          severity: warning
          service: restful-api
          component: assistant-quota
        annotations:
          summary: "Campus Assistant global daily quota is 90% exhausted (>180/200)"
          description: >-
            Daily DeepSeek synthesis attempts have reached {{ $value }} of the 200 global limit.
            Subsequent user requests will fall back to local lexical RAG with reasonCode
            GLOBAL_QUOTA_EXCEEDED.
          runbook_url: "docs/integrations/deepseek-assistant.md#runtime-configuration"
          instrumentation_status: "INSTRUMENTED (MetricsConfiguration and assigned assistant boundaries)"

      # -----------------------------------------------------------------------
      # 3. Assistant Row-Level-Security (RLS) Runtime Degraded
      # HealthController line 83 checks AssistantRlsState (verified vs degraded)
      # -----------------------------------------------------------------------
      - alert: AssistantRlsStateDegraded
        expr: >-
          campuscore_assistant_rls_verified == 0
        for: 2m
        labels:
          severity: warning
          service: restful-api
          component: assistant-rls
        annotations:
          summary: "Assistant RLS state is unverified or degraded"
          description: >-
            The Assistant runtime verifier is absent or has not verified isolation.
            In persistence deployments, the degraded runtime gate blocks chat with HTTP 503.
            Primary database readiness remains independent of this signal.
          runbook_url: "docs/integrations/supabase-assistant.md"
          instrumentation_status: "INSTRUMENTED (MetricsConfiguration and assigned assistant boundaries)"

      # -----------------------------------------------------------------------
      # 4. Assistant Turn Recovery Surge / Stale Leases
      # State machine: RESERVED -> DISPATCHED -> COMPLETED (or FAILED_AMBIGUOUS)
      # Sweep period: 30s (ASSISTANT_RECOVERY_DELAY_MS: 30000)
      # -----------------------------------------------------------------------
      - alert: AssistantStaleLeaseRecoverySurge
        expr: >-
          increase(campuscore_assistant_turn_stale_recovered_total[10m]) > 5
        for: 2m
        labels:
          severity: warning
          service: restful-api
          component: assistant-recovery
        annotations:
          summary: "Elevated number of assistant turn leases recovered"
          description: >-
            Committed sweep and opportunistic recovery transitions recovered {{ $value }} expired turn leases.
            Investigate thread starvation, unhandled timeouts in provider client, or
            database network partitions.
          runbook_url: "docs/integrations/deepseek-assistant.md#api-behavior"
          instrumentation_status: "INSTRUMENTED (MetricsConfiguration and assigned assistant boundaries)"
