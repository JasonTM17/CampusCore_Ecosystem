# Run: promtool test rules ops/monitoring/alert-tests.yml
# Fixtures only until promtool runs; no live collection or routing is implied.
rule_files:
- alerts-api-slo.yml
- alerts-infrastructure.yml
- alerts-assistant.yml
evaluation_interval: 1m
tests:
- name: absent-series-do-not-imply-a-breach-or-health
  interval: 1m
  input_series: []
  promql_expr_test:
  - expr: count(ALERTS{alertstate="firing"}) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 0
- name: zero-traffic-and-healthy-gauges
